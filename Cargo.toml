[package]
name = "gpu_extrema_classifier"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
clap = { version = "4.6.7", features = ["derive"] }
claxon = "0.4.3"
colored = "3.1.1"
comfy-table = "8.0.1"
csv = "1.4.0"
eframe = "0.37.0"
egui_plot = "0.38.0"
pollster = "1.0.1"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
wgpu = "30.0.1"

[profile.dev]
debug = 0
strip = true

[profile.release]
opt-level = 3
strip = true

[profile.release.package.gpu_extrema_classifier]
opt-level = 1

